<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chantiers à récupérer</title>
    <meta name="theme-color" content="#0F172A">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
        :root{
            --bg-primary:#0F172A;--bg-secondary:#1E293B;--bg-card:#334155;
            --accent:#F97316;--accent-hover:#EA580C;
            --text-primary:#F1F5F9;--text-secondary:#94A3B8;
            --border:#475569;--warning:#F59E0B;--info:#3B82F6;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        html,body{height:100%;}
        body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg-primary);color:var(--text-primary);display:flex;flex-direction:column;}

        header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg-secondary);border-bottom:1px solid var(--border);flex-wrap:wrap;}
        .title{font-family:'Space Mono',monospace;font-weight:700;font-size:1.05rem;color:var(--accent);margin-right:auto;}
        .sub{font-size:.8rem;color:var(--text-secondary);}
        .pill{background:var(--accent);color:var(--bg-primary);font-family:'Space Mono',monospace;font-weight:700;font-size:.8rem;padding:4px 12px;border-radius:20px;}
        .hdr-btn{background:var(--bg-card);border:1px solid var(--border);color:var(--text-primary);border-radius:8px;padding:7px 12px;font-size:.82rem;cursor:pointer;font-family:inherit;}
        .hdr-btn:hover{border-color:var(--accent);color:var(--accent);}

        .layout{flex:1;display:flex;min-height:0;}
        .list{width:330px;flex-shrink:0;overflow-y:auto;background:var(--bg-secondary);border-right:1px solid var(--border);padding:12px;}
        #map{flex:1;min-height:0;background:#1e293b;}

        .section{font-family:'Space Mono',monospace;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary);margin:4px 0 10px;}
        .item{display:flex;gap:10px;width:100%;text-align:left;background:var(--bg-card);border:2px solid transparent;border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;color:inherit;font-family:inherit;transition:border-color .2s,transform .2s;}
        .item:hover,.item.active{border-color:var(--accent);}
        .item:hover{transform:translateX(3px);}
        .item.nogeo{cursor:default;opacity:.75;border-style:dashed;border-color:var(--border);}
        .item.nogeo:hover{transform:none;}
        .num{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--bg-primary);font:700 .78rem 'Space Mono',monospace;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
        .item.nogeo .num{background:var(--bg-secondary);color:var(--warning);border:1px solid var(--warning);}
        .item-body{flex:1;min-width:0;}
        .addr{font-weight:600;font-size:.88rem;line-height:1.3;}
        .meta{font-size:.75rem;color:var(--text-secondary);margin-top:4px;font-family:'Space Mono',monospace;}
        .count-tag{display:inline-block;margin-top:5px;font-size:.7rem;color:var(--warning);font-weight:600;}

        .empty{margin:auto;max-width:420px;text-align:center;padding:40px 20px;}
        .empty-icon{font-size:2.6rem;margin-bottom:12px;}
        .empty h2{font-family:'Space Mono',monospace;color:var(--accent);font-size:1.1rem;margin-bottom:8px;}
        .empty p{color:var(--text-secondary);font-size:.9rem;}

        /* Marqueurs */
        .pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent);border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;}
        .pin span{transform:rotate(45deg);font:700 .72rem 'Space Mono',monospace;color:var(--bg-primary);}
        .pin.multi{background:var(--warning);}

        /* Popups */
        .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border);}
        .leaflet-popup-content{margin:12px 14px;font-family:'IBM Plex Sans',sans-serif;min-width:220px;}
        .leaflet-container a.leaflet-popup-close-button{color:var(--text-secondary);}
        .pp-entry+.pp-entry{border-top:1px solid var(--border);margin-top:10px;padding-top:10px;}
        .pp-head{font-family:'Space Mono',monospace;font-size:.7rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;}
        .pp-addr{font-weight:600;font-size:.9rem;margin-top:4px;}
        .pp-meta{font-size:.78rem;color:var(--text-secondary);margin-top:4px;line-height:1.5;}
        .nav{display:flex;gap:8px;margin-top:12px;}
        .nav a{flex:1;text-align:center;text-decoration:none;font-size:.78rem;font-weight:700;padding:8px 6px;border-radius:8px;background:var(--accent);color:var(--bg-primary)!important;}
        .nav a.alt{background:var(--bg-card);color:var(--text-primary)!important;border:1px solid var(--border);}

        @media(max-width:760px){
            body{height:auto;min-height:100%;}
            .layout{flex-direction:column;}
            #map{flex:none;height:58vh;}
            .list{width:100%;border-right:none;border-top:1px solid var(--border);}
        }
    </style>
</head>
<body>
    <header>
        <div>
            <div class="title">🚧 Chantiers à récupérer</div>
            <div class="sub" id="subtitle"></div>
        </div>
        <span class="pill" id="countPill" style="display:none;"></span>
        <button class="hdr-btn" id="fitBtn" style="display:none;">🎯 Tout voir</button>
    </header>
    <div class="layout" id="layout">
        <aside class="list" id="list"></aside>
        <div id="map"></div>
    </div>

<script>
    // ── Lecture des chantiers transmis par Power Apps (après le # de l'URL) ──
    // Format attendu : [{"lat":..,"lon":..,"adr":"..","pit":"..","tech":"..","date":".."}, ...]
    function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function num(v){if(v===null||v===undefined||v==='')return NaN;return parseFloat(String(v).replace(',','.'));}
    function txt(v){if(v===null||v===undefined)return'';v=String(v).trim();return v==='None'?'':v;}

    function readPoints(){
        const raw=location.hash.slice(1);
        if(!raw)return{error:"Aucun chantier reçu. Ouvrez cette carte depuis le bouton de l'application."};
        try{
            const data=JSON.parse(decodeURIComponent(raw));
            if(!Array.isArray(data))throw new Error();
            return{data};
        }catch(e){return{error:"Les données reçues sont illisibles. Relancez la carte depuis l'application."};}
    }

    function showError(msg){
        document.getElementById('layout').innerHTML=`<div class="empty"><div class="empty-icon">🗺️</div><h2>Carte indisponible</h2><p>${esc(msg)}</p></div>`;
    }

    // Date + heure (« 12/10/2026 à 08:30 »). Une date seule (« 2026-10-12 ») s'affiche sans heure.
    function fmtDate(v){
        if(!v)return'';
        const s=String(v).trim();
        const dateOnly=/^\d{4}-\d{2}-\d{2}$/.test(s);
        const d=dateOnly?new Date(s+'T00:00:00'):new Date(s);
        if(isNaN(d))return s;
        const datePart=d.toLocaleDateString('fr-BE',{day:'2-digit',month:'2-digit',year:'numeric'});
        if(dateOnly)return datePart;
        const timePart=d.toLocaleTimeString('fr-BE',{hour:'2-digit',minute:'2-digit'});
        return `${datePart} à ${timePart}`;
    }

    const res=readPoints();
    if(res.error){showError(res.error);}
    else{
        const items=res.data.map(p=>({
            lat:num(p.lat),lon:num(p.lon),
            adr:txt(p.adr),pit:txt(p.pit),tech:txt(p.tech),date:txt(p.date)
        }));
        const geo=items.filter(p=>isFinite(p.lat)&&isFinite(p.lon)&&Math.abs(p.lat)<=90&&Math.abs(p.lon)<=180);
        const noGeo=items.filter(p=>!geo.includes(p));

        // Regrouper les chantiers situés exactement au même endroit
        const groups=[];const byKey={};
        geo.forEach(p=>{
            const k=p.lat.toFixed(5)+','+p.lon.toFixed(5);
            if(!byKey[k]){byKey[k]={lat:p.lat,lon:p.lon,entries:[]};groups.push(byKey[k]);}
            byKey[k].entries.push(p);
        });

        // En-tête
        document.getElementById('countPill').textContent=`${items.length} chantier${items.length>1?'s':''}`;
        document.getElementById('countPill').style.display='inline-block';
        const techs=[...new Set(items.map(p=>p.tech).filter(Boolean))];
        document.getElementById('subtitle').textContent=techs.length===1?`Technicien : ${techs[0]}`:(techs.length>1?`${techs.length} techniciens`:'');

        // Carte
        const map=L.map('map').setView([50.6,4.3],9);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);

        function popupHTML(g,n){
            const entries=g.entries.map(p=>`<div class="pp-entry">
                <div class="pp-head">Chantier n°${n}${p.pit?' · PIT '+esc(p.pit):''}</div>
                <div class="pp-addr">${esc(p.adr||'Adresse non renseignée')}</div>
                <div class="pp-meta">${p.tech?'👷 '+esc(p.tech)+'<br>':''}${p.date?'📅 '+esc(fmtDate(p.date)):''}</div>
            </div>`).join('');
            const dest=`${g.lat},${g.lon}`;
            return `${entries}<div class="nav">
                <a href="https://www.google.com/maps/dir/?api=1&destination=${dest}" target="_blank" rel="noopener">🧭 Google Maps</a>
                <a class="alt" href="https://waze.com/ul?ll=${dest}&navigate=yes" target="_blank" rel="noopener">Waze</a>
            </div>`;
        }

        const markers=[];
        groups.forEach((g,i)=>{
            const n=i+1,multi=g.entries.length>1;
            const icon=L.divIcon({className:'',html:`<div class="pin${multi?' multi':''}"><span>${n}</span></div>`,iconSize:[30,30],iconAnchor:[15,30],popupAnchor:[0,-30]});
            markers.push(L.marker([g.lat,g.lon],{icon}).addTo(map).bindPopup(popupHTML(g,n)));
        });

        function fitAll(){
            if(!groups.length)return;
            if(groups.length===1)map.setView([groups[0].lat,groups[0].lon],15);
            else map.fitBounds(groups.map(g=>[g.lat,g.lon]),{padding:[40,40],maxZoom:15});
        }
        fitAll();
        if(groups.length>1){const b=document.getElementById('fitBtn');b.style.display='inline-block';b.addEventListener('click',fitAll);}

        // Liste
        const list=document.getElementById('list');
        let html='';
        if(groups.length){
            html+=`<div class="section">Sur la carte (${geo.length})</div>`;
            html+=groups.map((g,i)=>{
                const p=g.entries[0];
                const metaParts=[p.pit?'PIT '+esc(p.pit):'',p.date?esc(fmtDate(p.date)):''].filter(Boolean).join(' · ');
                return `<button class="item" data-i="${i}">
                    <div class="num">${i+1}</div>
                    <div class="item-body">
                        <div class="addr">${esc(p.adr||'Adresse non renseignée')}</div>
                        ${metaParts?`<div class="meta">${metaParts}</div>`:''}
                        ${g.entries.length>1?`<div class="count-tag">${g.entries.length} chantiers à cette adresse</div>`:''}
                    </div>
                </button>`;
            }).join('');
        }
        if(noGeo.length){
            html+=`<div class="section" style="margin-top:16px;">Sans coordonnées (${noGeo.length})</div>`;
            html+=noGeo.map(p=>`<div class="item nogeo">
                <div class="num">!</div>
                <div class="item-body">
                    <div class="addr">${esc(p.adr||'Adresse non renseignée')}</div>
                    <div class="meta">${[p.pit?'PIT '+esc(p.pit):'','Position introuvable'].filter(Boolean).join(' · ')}</div>
                </div>
            </div>`).join('');
        }
        if(!items.length)html='<div class="empty"><p>Aucun chantier dans la sélection.</p></div>';
        list.innerHTML=html;

        list.querySelectorAll('.item[data-i]').forEach(btn=>btn.addEventListener('click',()=>{
            const i=+btn.dataset.i,g=groups[i];
            list.querySelectorAll('.item').forEach(b=>b.classList.remove('active'));
            btn.classList.add('active');
            map.setView([g.lat,g.lon],16);
            markers[i].openPopup();
            if(window.innerWidth<=760)document.getElementById('map').scrollIntoView({behavior:'smooth'});
        }));
    }
</script>
</body>
</html>
